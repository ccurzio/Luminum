[package]
name = "Lumy_Integrity"
version = "0.0.1"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
notify = "6.1"
notify-debouncer-full = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.26"
users = "0.11"
getrandom = "0.2"
chrono = "0.4"
ed25519-dalek = "2.2"
base64ct = { version = "1.6", features = ["alloc"] }
