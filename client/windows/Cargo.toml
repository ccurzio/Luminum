[package]
name = "LuminumClient"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = "3.2"
chrono = "0.4"
ctrlc = "3.3"
colored = "2.0"
native-tls = "0.2"
rusqlite = { version = "0.26", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
local-ip-address = "0.6"
gethostname = "0.4"
getrandom = "0.2"
sha2 = "0.10"
ed25519-dalek = "2.2"
base64ct = { version = "1.6", features = ["alloc"] }
rumqttc = "0.25.1"
# Pure-Rust signature verification for the X.509 trust-anchor validation
# (protocol 7.1). Replaces the OpenSSL dependency the Linux client used to
# read the server signing certificate. ring is already a transitive
# dependency (via rustls/rumqttc), so this adds no new build burden.
ring = "0.17"
# Client TLS keypair + CSR (protocol §7.1 v1.1): already in the tree via
# rustls (rumqttc); used directly for the P-256 keypair and CSR signature.
# default-features = false (as rustls uses it): the default ring-io /
# ring-sig-verify features would pull in untrusted, which is not in the
# offline crate cache.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "alloc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
] }
