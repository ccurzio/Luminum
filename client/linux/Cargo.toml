[package]
name = "LuminumClient"
version = "0.0.1"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
clap = "3.2"
chrono = "0.4"
ctrlc = "3.3"
colored = "2.0"
native-tls = "0.2"
openssl = "0.10"
rusqlite = "0.26"
etc-os-release = "0.1"
gethostname = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
local-ip-address = "0.6"
getrandom = "0.2"
sha2 = "0.10"
ed25519-dalek = "2.2"
base64ct = { version = "1.6", features = ["alloc"] }
rumqttc = "0.25.1"

[dependencies]
futures = "0.3"
